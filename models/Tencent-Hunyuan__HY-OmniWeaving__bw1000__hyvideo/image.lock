## 为什么用它

- 唯一自带 DCU 版 torch 2.9 + torchvision 的镜像；本项目不自建镜像。
- 官方 hyvideo 依赖 `transformers 4.57.1 / diffusers 0.32.2 / huggingface_hub 0.34`，
  全部隔离装到 `/opt/omni-libs`（不覆盖镜像内 5.3.0），见 `requirements-extra.txt`。
- 官方要求 `flash_attn`：镜像自带的版本**可用但有 API 差异**（`unpad_input` 返回 4 项而非 5 项），
  需要 `patches/0001-flash-attn-unpad-compat.patch`，详见 README §3.3。
